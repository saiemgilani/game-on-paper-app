services:
  python:
    image: ghcr.io/saiemgilani/saiemgilani/game-on-paper-python-api:REPLACE_ME
    environment:
      - PYTHON_HTTP_TOKEN
      - GOP_PG_DSN=${GOP_PG_DSN:-}
      - GOP_PG_DSN_RO=${GOP_PG_DSN_RO:-}
      - GOP_INGEST_KEY=${GOP_INGEST_KEY:-}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-1}
    ports:
      - 3000:5000
    healthcheck:
      test: curl --fail http://python:5000/healthcheck || exit 1
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
