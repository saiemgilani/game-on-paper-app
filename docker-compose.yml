services:
  nginx:
    build: 
      context: ./nginx
    restart: unless-stopped
    ports:
      - 8080:8080
    depends_on:
      - python
    links:
      - python
  python:
    build: ./python
    environment:
      - PYTHON_HTTP_TOKEN=test-token
    expose:
      - 5000
    healthcheck:
      test: curl --fail http://python:5000/healthcheck || exit 1
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 4gb
