name: pr-evidence

# Posts the review evidence CLAUDE.md "PR evidence" requires on every PR that
# touches astro/ or python/: the desktop/mobile x light/dark screenshots of the PR,
# a Lighthouse comparison against its base, and a walkthrough video per evidence route
# (plus any `Walkthrough steps: scripts/walkthroughs/<flow>.mjs` the PR names), as ONE
# comment that each push updates.
#
# Base = the first parent of GitHub's PR merge commit (the base tip it merged
# onto); head = that merge commit. The comparison therefore isolates this PR's
# changes even when main has moved since the branch was cut.
#
# Pages come from an `Evidence routes: /a /b` line in the PR description (read at
# run time, so "Re-run jobs" picks up an edit); DEFAULT_ROUTES otherwise.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'astro/**'
      - 'python/**'

concurrency:
  group: pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Read-only by default; the evidence job widens it, and even there the token reaches only
# steps that run workflow-defined shell -- never the PR's own scripts (lighthouse-compare,
# visual-check, the preview build, the processor, the comment renderer). Checkouts do not
# persist it. Residual risk: PR code in an earlier step could alter GITHUB_ENV/PATH for a
# later step; fully isolating that needs a separate workflow_run publisher. This job runs
# only for same-repository PRs, whose authors already have write access.
permissions:
  contents: read

jobs:
  evidence:
    # A fork PR gets no secrets and a read-only token: it could neither render the
    # SDV-backed cards nor post the result. Drafts wait until ready for review.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # push screenshots + clips to pr-previews (publish step only)
      pull-requests: write   # post / update the evidence comment (post step only)
    env:
      PR: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # a final game with full play-by-play: the heaviest page on the site
      DEFAULT_ROUTES: /game/401856682
    steps:
      - uses: actions/checkout@v7
        with:
          # the PR merge commit (default for pull_request); full history for the base worktree
          fetch-depth: 0
          persist-credentials: false

      - name: Evidence directory (outside the checkout, so no build or test globs see it)
        run: echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install review tools (deliberately not repo dependencies)
        # recordVideo (walkthrough.mjs) needs Playwright's own ffmpeg build, not the runner's
        run: |
          npm i -g --no-audit --no-fund lighthouse@12 playwright-core@1
          playwright-core install ffmpeg

      - name: Local secrets for the preview Worker and the processor
        env:
          SDV_AUTH_TOKEN: ${{ secrets.SDV_AUTH_TOKEN }}
        run: |
          # both sides of this token live on this runner, so a throwaway one is enough
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          echo "PYTHON_HTTP_TOKEN=$token" >> "$GITHUB_ENV"
          umask 077
          {
            printf 'PYTHON_HTTP_TOKEN=%s\n' "$token"
            printf 'SDV_AUTH_TOKEN=%s\n' "$SDV_AUTH_TOKEN"
            printf 'ADMIN_USER=%s\nADMIN_PASS=%s\nGOP_INGEST_KEY=%s\n' "$(openssl rand -hex 8)" "$(openssl rand -hex 16)" "$(openssl rand -hex 16)"
          } > astro/.dev.vars

      - name: Resolve routes
        id: routes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.body // ""')"
          line="$(printf '%s\n' "$body" | sed -n 's/^[[:space:]]*Evidence routes:[[:space:]]*//Ip' | head -1 | tr -d '`\r')"
          # keep only path-shaped tokens (at most 4), so nothing else reaches a command line
          routes="$(printf '%s\n' "${line:-$DEFAULT_ROUTES}" | tr ' ,' '\n\n' | grep -E '^/[A-Za-z0-9/_.-]*$' | head -4 | tr '\n' ' ' || true)"
          echo "routes=${routes:-$DEFAULT_ROUTES}" >> "$GITHUB_OUTPUT"
          echo "routes: ${routes:-$DEFAULT_ROUTES}"
          # optional scripted flows: only committed files under scripts/walkthroughs/ (at most 4)
          sline="$(printf '%s\n' "$body" | sed -n 's/^[[:space:]]*Walkthrough steps:[[:space:]]*//Ip' | head -1 | tr -d '`\r')"
          steps=""
          for f in $(printf '%s\n' "$sline" | tr ' ,' '\n\n' | grep -E '^scripts/walkthroughs/[A-Za-z0-9_-]+\.mjs$' | head -4); do
            [ -f "astro/$f" ] && steps="$steps,$f"
          done
          echo "steps=${steps#,}" >> "$GITHUB_OUTPUT"
          echo "steps: ${steps:-(none)}"

      - name: Screenshots + Lighthouse comparison
        id: compare
        working-directory: astro
        env:
          ROUTES: ${{ steps.routes.outputs.routes }}
          STEPS: ${{ steps.routes.outputs.steps }}
          CHROME_PATH: /usr/bin/google-chrome
          VISUAL_CHECK_EXECUTABLE: /usr/bin/google-chrome
          # Ubuntu 24.04 runners block the unprivileged user namespaces Chrome's sandbox needs
          LIGHTHOUSE_NO_SANDBOX: '1'
          VISUAL_CHECK_NO_SANDBOX: '1'
        run: |
          export NODE_PATH="$(npm root -g)"
          set +e
          # ROUTES is validated above; word splitting into separate args is intended
          node scripts/lighthouse-compare.mjs --base HEAD^1 --head HEAD --runs 3 --shots \
            --walkthrough --steps "$STEPS" \
            --python-url http://127.0.0.1:5177 \
            --backend-cmd 'uv sync --locked --quiet && uv run gunicorn app:app -c gunicorn.conf.py -b 127.0.0.1:5177' \
            --out "$EVIDENCE_DIR" $ROUTES
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Remove local secrets once the preview is gone
        # the preview and processor needed them; nothing after this step does. (They were
        # necessarily readable by the PR code that ran in the comparison step.)
        if: always()
        run: find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp/gop-lighthouse -name '.dev.vars' -type f -print -delete 2>/dev/null || true

      - name: Keep raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-evidence-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish screenshots + walkthrough clips to pr-previews
        id: publish
        if: always() && steps.compare.outcome == 'success'
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          shots="$EVIDENCE_DIR/shots"
          clips="$EVIDENCE_DIR/walkthrough"
          if ! ls "$shots"/*.jpg "$clips"/*.mp4 >/dev/null 2>&1; then echo "nothing to publish"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          wt="$RUNNER_TEMP/pr-previews"
          dest="pr$PR/${PR_HEAD_SHA:0:7}"
          # one-shot auth for every pr-previews fetch and push (the checkout persists no token);
          # an unauthenticated fetch failing on a private repo would otherwise fall through to a
          # fresh orphan branch whose push is then rejected
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          # full fetch: the checkout is complete history, and a shallow fetch would graft it
          if git -c "http.https://github.com/.extraheader=$auth" fetch -q origin pr-previews; then
            git worktree add --detach "$wt" FETCH_HEAD
          else
            git worktree add --detach "$wt" HEAD
            git -C "$wt" checkout --orphan pr-previews
            git -C "$wt" rm -rfq .
          fi
          mkdir -p "$wt/$dest"
          cp "$shots"/*.jpg "$wt/$dest/" 2>/dev/null || true
          cp "$clips"/*.mp4 "$wt/$dest/" 2>/dev/null || true
          git -C "$wt" add "$dest"
          # a re-run of the same commit can reproduce identical images: nothing to commit, still publish
          if ! git -C "$wt" diff --cached --quiet; then
            git -C "$wt" commit -qm "chore(previews): PR #$PR @ ${PR_HEAD_SHA:0:7}"
            # other PRs push here concurrently; their paths never overlap, so rebase and retry
            for attempt in 1 2 3 4 5; do
              git -C "$wt" -c "http.https://github.com/.extraheader=$auth" push -q origin HEAD:refs/heads/pr-previews && break
              git -C "$wt" -c "http.https://github.com/.extraheader=$auth" fetch -q origin pr-previews
              git -C "$wt" rebase -q FETCH_HEAD
              [ "$attempt" = 5 ] && exit 1
            done
          fi
          sha="$(git -C "$wt" rev-parse HEAD)"
          echo "image_base=https://raw.githubusercontent.com/${{ github.repository }}/$sha/$dest" >> "$GITHUB_OUTPUT"

      - name: Render the evidence comment
        # runs the PR's comment script, so it gets no token
        if: always() && !cancelled()
        env:
          IMAGE_BASE: ${{ steps.publish.outputs.image_base }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/comment.md"
          if [ -f astro/scripts/pr-evidence-comment.mjs ] && [ -d "$EVIDENCE_DIR" ]; then
            node astro/scripts/pr-evidence-comment.mjs --out "$EVIDENCE_DIR" --image-base "$IMAGE_BASE" \
              --run-url "$RUN_URL" --pr-head "$PR_HEAD_SHA" --default-routes "$DEFAULT_ROUTES" > "$body"
          else
            printf '<!-- pr-evidence -->\n## PR evidence: `%s`\n\nThe evidence run failed before producing results. See the [run log](%s).\n' \
              "${PR_HEAD_SHA:0:7}" "$RUN_URL" > "$body"
          fi

      - name: Post or update the evidence comment
        # workflow-defined shell only: reads the rendered file, never executes repo code
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/comment.md"
          id="$(gh api --paginate "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-evidence -->"))) | .id' | tail -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F "body=@$body" --jq .html_url
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" -F "body=@$body" --jq .html_url
          fi

      - name: Fail when the comparison did not complete
        if: steps.compare.outputs.exit != '0'
        run: |
          echo "lighthouse-compare exited ${{ steps.compare.outputs.exit }}; the posted comment lists what failed."
          exit 1
