name: deploy

on:
  push:
    branches:
      - AE/cloudflare
  # repository_dispatch:
  #   types: [ deploy ]
  workflow_dispatch:
  # workflow_call:

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: saiemgilani/game-on-paper-app
      - uses: cloudflare/wrangler-action@v4
        env: 
          PYTHON_HTTP_TOKEN: ${{ secrets.PYTHON_HTTP_TOKEN }}
          SDV_AUTH_TOKEN: ${{ secrets.SDV_AUTH_TOKEN }}
          APP_VERSION: ${{ github.sha }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "./astro"
          secrets: |
            PYTHON_HTTP_TOKEN
            SDV_AUTH_TOKEN
          vars: |
            APP_VERSION
          preCommands: |
            npm install --save
            npm run build
      - name: Check that web is live
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://game-on-paper-astro.akeaswaran.workers.dev/ #https://gameonpaper.com|http://gameonpaper.com|https://www.gameonpaper.com|http://www.gameonpaper.com
          follow-redirect: false
          max-attempts: 10
          retry-delay: 5s

  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: saiemgilani/game-on-paper-app
      - name: Publish Python container to GitHub
        uses: mr-smithers-excellent/docker-build-push@b6e94a8afeb0887d5cddb51a1db7dcc6bb6864ba
        with:
          image: saiemgilani/game-on-paper-python-api
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
          directory: ./python
          dockerfile: ./python/Dockerfile
          tags: latest
      - name: Update SHA for docker compose
        run: |
          DOCKER_COMPOSE_CONTENT="$(cat ./docker-compose.do.yml)"
          SHA="${{ github.sha }}"
          DOCKER_COMPOSE_CONTENT="${DOCKER_COMPOSE_CONTENT//REPLACE_ME/$SHA}"
          echo $DOCKER_COMPOSE_CONTENT > ./docker-compose.do.yml
      - name: Push updated docker-compose override file
        uses: vtisweden/sftp-action@79906f399a4e708972c4a458a40f13d14ecd4304
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          localPath: "./docker-compose.do.yml"
          remotePath: "./docker-compose.yml"
      - name: Deploy package to DigitalOcean
        uses: garygrossgarten/github-action-ssh@3d6a341d282a92d2253ba26640fcc44f1a38ce92
        env:
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_COMPOSE_FILE: ${{ env.DOCKER_COMPOSE_FILE }}
          DOCKER_COMPOSE_OVERRIDE_FILE: ${{ env.DOCKER_COMPOSE_OVERRIDE_FILE }}
          PYTHON_HTTP_TOKEN: ${{ secrets.PYTHON_HTTP_TOKEN }}
        with:
          host: ${{ secrets.API_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          envs: GITHUB_USERNAME, GITHUB_TOKEN, DOCKER_COMPOSE_FILE, DOCKER_COMPOSE_OVERRIDE_FILE, PYTHON_HTTP_TOKEN
          script: |
            docker stop $(docker ps -a -q)
            docker system prune --force
            docker login ghcr.io -u $GITHUB_USERNAME -p $GITHUB_TOKEN
            docker-compose pull
            docker-compose -f docker-compose.yml up -d
      - name: Check that API is live
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://api.gameonpaper.com/healthcheck|http://api.gameonpaper.com/healthcheck
          follow-redirect: false
          max-attempts: 10
          retry-delay: 5s