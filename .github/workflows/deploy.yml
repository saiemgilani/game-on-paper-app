name: deploy

on:
  workflow_dispatch:

jobs:
  build-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: saiemgilani/game-on-paper-app
      - name: Publish Node container to GitHub
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: saiemgilani/game-on-paper-node
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
          directory: ./frontend
          dockerfile: ./frontend/Dockerfile
          tags: latest
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: saiemgilani/game-on-paper-app
      - name: Publish Python container to GitHub
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: saiemgilani/game-on-paper-python
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
          directory: ./python
          dockerfile: ./python/Dockerfile
          tags: latest
  build-python-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: saiemgilani/game-on-paper-app
      - name: Publish Python container to GitHub
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: saiemgilani/game-on-paper-python-v2
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
          directory: ./python-v2
          dockerfile: ./python-v2/Dockerfile
          tags: latest
  build-redis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: saiemgilani/game-on-paper-app
      - name: Publish Redis container to GitHub
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: saiemgilani/game-on-paper-redis
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
          directory: ./redis
          dockerfile: ./redis/Dockerfile.lru
          tags: latest
      - name: Publish Redis container to GitHub
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: saiemgilani/game-on-paper-cache
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
          directory: ./redis
          dockerfile: ./redis/Dockerfile.cache
          tags: latest
  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-node
      - build-python
      - build-redis
      - build-python-v2
    steps:
      - uses: actions/checkout@v7
        with:
          repository: saiemgilani/game-on-paper-app
      - name: Push updated docker-compose override file
        uses: vtisweden/sftp-action@v1.0.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          localPath: "./config/apache2.conf"
          remotePath: "/etc/apache2/sites-enabled/gameonpaper.com.conf"
      - name: Push updated Apache config file
        uses: vtisweden/sftp-action@v1.0.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          localPath: "./docker-compose.do.yml"
          remotePath: "./docker-compose.yml"
      - name: Deploy package to DigitalOcean
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_COMPOSE_FILE: ${{ env.DOCKER_COMPOSE_FILE }}
          DOCKER_COMPOSE_OVERRIDE_FILE: ${{ env.DOCKER_COMPOSE_OVERRIDE_FILE }}
          PYTHON_HTTP_TOKEN: ${{ secrets.PYTHON_HTTP_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          envs: GITHUB_USERNAME, GITHUB_TOKEN, DOCKER_COMPOSE_FILE, DOCKER_COMPOSE_OVERRIDE_FILE, PYTHON_HTTP_TOKEN
          script: |
            docker stop $(docker ps -a -q)
            docker system prune --force
            docker login ghcr.io -u $GITHUB_USERNAME -p $GITHUB_TOKEN
            docker-compose pull
            docker-compose -f docker-compose.yml up -d
            systemctl reload apache2
      # - name: Check that site is live
      #   uses: jtalk/url-health-check-action@v5
      #   with:
      #     url: https://gameonpaper.com|http://gameonpaper.com
      #     follow-redirect: false
      #     max-attempts: 10
      #     retry-delay: 5s
