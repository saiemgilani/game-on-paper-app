name: deploy

# One deploy per burst: every job shares one concurrency group, queued not
# cancelled (cancelling mid-compose is how the 2026-08-31 outage happened).
# GitHub keeps at most one running + one pending run per group and supersedes
# anything between, so N rapid merges collapse to at most two deploys -- and
# with the merge queue batching PRs into a single push, exactly one.
concurrency:
  group: deploy
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [ deploy ]
  workflow_dispatch:
  workflow_call:

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: saiemgilani/game-on-paper-app
      - uses: cloudflare/wrangler-action@v4
        env:
          PYTHON_HTTP_TOKEN: ${{ secrets.PYTHON_HTTP_TOKEN }}
          SDV_AUTH_TOKEN: ${{ secrets.SDV_AUTH_TOKEN }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          GOP_INGEST_KEY: ${{ secrets.GOP_INGEST_KEY }}
          TELEMETRY_ENABLED: ${{ secrets.TELEMETRY_ENABLED }}
          # sha alone is NOT unique per deploy: repository_dispatch (sdv-py main moved)
          # re-deploys the same repo sha with a new parser. run_id makes every deploy
          # bust the API-layer cacheKey in resources/python.ts.
          APP_VERSION: ${{ github.sha }}-${{ github.run_id }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "./astro"
          # PYTHON_HTTP_URL is intentionally NOT pushed as a secret: it already
          # exists as a plaintext var in wrangler.jsonc and a same-name secret
          # would collide with that binding.
          secrets: |
            PYTHON_HTTP_TOKEN
            SDV_AUTH_TOKEN
            ADMIN_USER
            ADMIN_PASS
            GOP_INGEST_KEY
            TELEMETRY_ENABLED
          vars: |
            APP_VERSION
          preCommands: |
            npm ci
            npm run build
      # - name: Check that web is live
      #   uses: jtalk/url-health-check-action@v5
      #   with:
      #     url: https://gameonpaper.com/health
      #     follow-redirect: true
      #     max-attempts: 10
      #     retry-delay: 5s

  deploy-api:
    runs-on: ubuntu-latest
    # Two merges minutes apart ran this job twice in parallel on 2026-08-31: run A
    # pulled its image, run B overwrote docker-compose.yml on the host, run A's
    # down+up then pulled B's image into a full disk and the API stayed down.
    # Queue deploys to the host; never cancel one mid-compose.
    concurrency:
      group: deploy-api-host
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          repository: saiemgilani/game-on-paper-app
      - name: Resolve sportsdataverse-py main
        id: sdvpy
        # The image re-resolves sportsdataverse-py main at build time; this SHA is
        # the cache-buster that makes a new main commit invalidate that layer. A
        # repository_dispatch from sportsdataverse-py carries it directly.
        run: |
          sha="${{ github.event.client_payload.sportsdataverse_py_sha }}"
          if [ -z "$sha" ]; then
            sha="$(git ls-remote https://github.com/sportsdataverse/sportsdataverse-py.git refs/heads/main | cut -f1)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "sportsdataverse-py main @ $sha"
      - name: Publish Python container to GitHub
        uses: mr-smithers-excellent/docker-build-push@v7.0
        with:
          image: saiemgilani/game-on-paper-python-api
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
          directory: ./python
          dockerfile: ./python/Dockerfile
          addLatest: true
          tags: ${{ github.sha }}
          buildArgs: SDV_PY_MAIN_SHA=${{ steps.sdvpy.outputs.sha }}
      - name: Update SHA for docker compose
        run: |
          DOCKER_COMPOSE_CONTENT="$(cat ./docker-compose.do.yml)"
          SHA="${{ github.sha }}"
          DOCKER_COMPOSE_CONTENT="${DOCKER_COMPOSE_CONTENT//REPLACE_ME/$SHA}"
          echo "$DOCKER_COMPOSE_CONTENT" > ./docker-compose.do.yml
          cat ./docker-compose.do.yml
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.PORT }} ${{ secrets.API_HOST }} >> ~/.ssh/known_hosts
      - name: Restart Docker Compose
        env:
          SSH_HOST: ${{ secrets.API_HOST }}
          SSH_USER: ${{ secrets.API_USERNAME }}
          SSH_PORT: ${{ secrets.PORT }}
          PYTHON_HTTP_TOKEN: ${{ secrets.PYTHON_HTTP_TOKEN }}
          GOP_PG_DSN: ${{ secrets.GOP_PG_DSN }}
          GOP_PG_DSN_RO: ${{ secrets.GOP_PG_DSN_RO }}
          GOP_INGEST_KEY: ${{ secrets.GOP_INGEST_KEY }}
          TELEMETRY_ENABLED: ${{ secrets.TELEMETRY_ENABLED }}
        run: |
          # Build the compose env file on the runner from real env vars (never
          # interpolate secret values into shell source: an apostrophe/newline
          # in a DSN would break the remote script after containers stopped).
          {
            printf 'PYTHON_HTTP_TOKEN=%s\n' "$PYTHON_HTTP_TOKEN"
            printf 'GOP_PG_DSN=%s\n' "$GOP_PG_DSN"
            printf 'GOP_PG_DSN_RO=%s\n' "$GOP_PG_DSN_RO"
            printf 'GOP_INGEST_KEY=%s\n' "$GOP_INGEST_KEY"
            printf 'TELEMETRY_ENABLED=%s\n' "$TELEMETRY_ENABLED"
          } > deploy.env

          sftp -i ~/.ssh/deploy_key -P $SSH_PORT $SSH_USER@$SSH_HOST bash << 'ENDSSH'
            put docker-compose.do.yml docker-compose.yml
            put deploy.env .env
          ENDSSH

          ssh -i ~/.ssh/deploy_key -p $SSH_PORT $SSH_USER@$SSH_HOST bash << 'ENDSSH'
            set -e
            chmod 600 .env
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ secrets.GH_USERNAME }} --password-stdin
            echo "disk before: $(df -h / | tail -1)"
            # Free space BEFORE pulling, touching nothing that is running: stopped
            # containers, build cache, and images no container references. The old
            # trailing `system prune` (no -a) kept every previous deploy's tagged
            # image, which is how the disk filled on 2026-08-31.
            docker container prune -f
            docker image prune -af
            docker builder prune -af
            # Pull with the old container still serving. If this fails (disk,
            # registry, network) `set -e` stops here and nothing goes down.
            docker compose -f docker-compose.yml pull
            # `docker stop` leaves the stopped container in place, so the next
            # `up` collides with its name ("container name is already in use").
            # `compose down` stops AND removes what compose owns, which is also
            # narrower than stopping every container on the host.
            docker compose -f docker-compose.yml down --remove-orphans || true
            # No --pull always: the image is already local, and a second pull
            # could race a compose file rewritten by a later run.
            docker compose -f docker-compose.yml up -d
            docker compose -f docker-compose.yml ps
            # Fail the run if the new container never becomes healthy (compose
            # healthcheck: 20s start + 60s interval), instead of a green deploy
            # in front of a red API.
            cid=$(docker compose -f docker-compose.yml ps -q python)
            for i in $(seq 1 36); do
              st=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid" 2>/dev/null || echo missing)
              echo "health: $st"
              [ "$st" = healthy ] && break
              case "$st" in exited|dead|missing) docker compose -f docker-compose.yml logs --tail 50; exit 1 ;; esac
              [ $i -eq 36 ] && { echo "API not healthy after 180s"; docker compose -f docker-compose.yml logs --tail 50; exit 1; }
              sleep 5
            done
            # The previous image is unreferenced now; drop it too.
            docker image prune -af
            echo "disk after: $(df -h / | tail -1)"
          ENDSSH

      # - name: Check that API is live
      #   uses: jtalk/url-health-check-action@v5
      #   with:
      #     url: https://api.gameonpaper.com/healthcheck
      #     follow-redirect: true
      #     max-attempts: 10
      #     retry-delay: 5s