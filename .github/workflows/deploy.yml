name: deploy

on:
  push:
    branches:
      - AE/cloudflare
  # repository_dispatch:
  #   types: [ deploy ]
  workflow_dispatch:
  # workflow_call:

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: saiemgilani/game-on-paper-app
      - uses: cloudflare/wrangler-action@v4
        env: 
          PYTHON_HTTP_TOKEN: ${{ secrets.PYTHON_HTTP_TOKEN }}
          SDV_AUTH_TOKEN: ${{ secrets.SDV_AUTH_TOKEN }}
          APP_VERSION: ${{ github.sha }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "./astro"
          secrets: |
            PYTHON_HTTP_TOKEN
            SDV_AUTH_TOKEN
          vars: |
            APP_VERSION
          preCommands: |
            npm install --save
            npm run build
      - name: Check that web is live
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://game-on-paper-astro.akeaswaran.workers.dev/ #https://gameonpaper.com|http://gameonpaper.com|https://www.gameonpaper.com|http://www.gameonpaper.com
          follow-redirect: false
          max-attempts: 10
          retry-delay: 5s

