name: deploy

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [ deploy ]
  workflow_dispatch:
  workflow_call:

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: saiemgilani/game-on-paper-app
      - uses: cloudflare/wrangler-action@v4
        env:
          PYTHON_HTTP_TOKEN: ${{ secrets.PYTHON_HTTP_TOKEN }}
          SDV_AUTH_TOKEN: ${{ secrets.SDV_AUTH_TOKEN }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          GOP_INGEST_KEY: ${{ secrets.GOP_INGEST_KEY }}
          TELEMETRY_ENABLED: ${{ secrets.TELEMETRY_ENABLED }}
          APP_VERSION: ${{ github.sha }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "./astro"
          # PYTHON_HTTP_URL is intentionally NOT pushed as a secret: it already
          # exists as a plaintext var in wrangler.jsonc and a same-name secret
          # would collide with that binding.
          secrets: |
            PYTHON_HTTP_TOKEN
            SDV_AUTH_TOKEN
            ADMIN_USER
            ADMIN_PASS
            GOP_INGEST_KEY
            TELEMETRY_ENABLED
          vars: |
            APP_VERSION
          preCommands: |
            npm ci
            npm run build
      # - name: Check that web is live
      #   uses: jtalk/url-health-check-action@v5
      #   with:
      #     url: https://gameonpaper.com/health
      #     follow-redirect: true
      #     max-attempts: 10
      #     retry-delay: 5s

  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: saiemgilani/game-on-paper-app
      - name: Publish Python container to GitHub
        uses: mr-smithers-excellent/docker-build-push@v7.0
        with:
          image: saiemgilani/game-on-paper-python-api
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
          directory: ./python
          dockerfile: ./python/Dockerfile
          addLatest: true
          tags: ${{ github.sha }}
      - name: Update SHA for docker compose
        run: |
          DOCKER_COMPOSE_CONTENT="$(cat ./docker-compose.do.yml)"
          SHA="${{ github.sha }}"
          DOCKER_COMPOSE_CONTENT="${DOCKER_COMPOSE_CONTENT//REPLACE_ME/$SHA}"
          echo "$DOCKER_COMPOSE_CONTENT" > ./docker-compose.do.yml
          cat ./docker-compose.do.yml
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.PORT }} ${{ secrets.API_HOST }} >> ~/.ssh/known_hosts
      - name: Restart Docker Compose
        env:
          SSH_HOST: ${{ secrets.API_HOST }}
          SSH_USER: ${{ secrets.API_USERNAME }}
          SSH_PORT: ${{ secrets.PORT }}
          PYTHON_HTTP_TOKEN: ${{ secrets.PYTHON_HTTP_TOKEN }}
          GOP_PG_DSN: ${{ secrets.GOP_PG_DSN }}
          GOP_PG_DSN_RO: ${{ secrets.GOP_PG_DSN_RO }}
          GOP_INGEST_KEY: ${{ secrets.GOP_INGEST_KEY }}
          TELEMETRY_ENABLED: ${{ secrets.TELEMETRY_ENABLED }}
        run: |
          # Build the compose env file on the runner from real env vars (never
          # interpolate secret values into shell source: an apostrophe/newline
          # in a DSN would break the remote script after containers stopped).
          {
            printf 'PYTHON_HTTP_TOKEN=%s\n' "$PYTHON_HTTP_TOKEN"
            printf 'GOP_PG_DSN=%s\n' "$GOP_PG_DSN"
            printf 'GOP_PG_DSN_RO=%s\n' "$GOP_PG_DSN_RO"
            printf 'GOP_INGEST_KEY=%s\n' "$GOP_INGEST_KEY"
            printf 'TELEMETRY_ENABLED=%s\n' "$TELEMETRY_ENABLED"
          } > deploy.env

          sftp -i ~/.ssh/deploy_key -P $SSH_PORT $SSH_USER@$SSH_HOST bash << 'ENDSSH'
            put docker-compose.do.yml docker-compose.yml
            put deploy.env .env
          ENDSSH

          ssh -i ~/.ssh/deploy_key -p $SSH_PORT $SSH_USER@$SSH_HOST bash << 'ENDSSH'
            set -e
            chmod 600 .env
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ secrets.GH_USERNAME }} --password-stdin
            docker compose pull
            # `docker stop` leaves the stopped container in place, so the next
            # `up` collides with its name ("container name is already in use").
            # `compose down` stops AND removes what compose owns, which is also
            # narrower than stopping every container on the host.
            docker compose -f docker-compose.yml down --remove-orphans || true
            docker compose -f docker-compose.yml up -d --pull always
            docker compose -f docker-compose.yml ps
            docker system prune --force
          ENDSSH

      # - name: Check that API is live
      #   uses: jtalk/url-health-check-action@v5
      #   with:
      #     url: https://api.gameonpaper.com/healthcheck
      #     follow-redirect: true
      #     max-attempts: 10
      #     retry-delay: 5s