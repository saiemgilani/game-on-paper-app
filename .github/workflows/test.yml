name: test
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true  # astro needs >=22.23.4; a runner's cached 22.x can be older
          cache: npm
          cache-dependency-path: astro/package-lock.json
      # astro/package-lock.json is tracked (see .gitignore note); ci installs the
      # locked tree and cannot drift with the registry.
      - run: npm ci --no-audit --no-fund
        working-directory: astro
      # Renders a real game page through the Astro Container API (see
      # test/gamePage.render.test.ts). A frontmatter throw fails here instead of
      # shipping as an empty 200 -- which is exactly what happened on 2026-08-31.
      - run: npx vitest run
        working-directory: astro
  pytest:
    # The Flask processor. This job did not exist when #224's merge commit
    # landed with unresolved conflict markers in python/app.py: vitest was green,
    # the module did not parse, and the API deploy failed on restart. A syntax or
    # import error here blocks the merge instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --locked
        working-directory: python
      - run: uv run pytest -q
        working-directory: python
        env:
          PYTHON_HTTP_TOKEN: test
  teams-index:
    # astro/src/static/teams.json (the matchup builder's selects, /teams, the sitemap) is a
    # snapshot of cfb.team_summaries' team-seasons. It drifted by hand every season (#333,
    # #338); this fails when the two differ. Fix: `uv run scripts/update_teams.py`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: teams.json matches cfb.team_summaries
        env:
          SDV_AUTH_TOKEN: ${{ secrets.SDV_AUTH_TOKEN }}
          FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          # a fork PR gets no secrets: nothing to read the Data API with. Anywhere else a missing
          # token is a misconfiguration, and the check fails rather than passing unchecked.
          if [ -z "$SDV_AUTH_TOKEN" ]; then
            if [ "$FORK_PR" = "true" ]; then echo "::notice::fork PR, no SDV_AUTH_TOKEN; teams.json drift check skipped"; exit 0; fi
            echo "::error::SDV_AUTH_TOKEN is not set"; exit 1
          fi
          uv run scripts/update_teams.py --check
